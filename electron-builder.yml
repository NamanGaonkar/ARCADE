appId: gg.arcadex.launcher
productName: ArcadeX
beforePack: scripts/legendary-before-pack.cjs
afterPack: scripts/legendary-after-pack.cjs
afterSign: scripts/legendary-after-pack.cjs
directories:
  buildResources: build
extraResources:
  - ludusavi
  - hydra-native
  - seeds
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: app-icon.ico
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
  - from: resources/achievement.wav
  - from: "src/big-picture/src/assets/audio/Favorite Sound.wav"
    to: chat-message.wav
files:
  - "!.cache/**"
  - "!legendary/**"
  - "!resources/legendary/**"
  - "!native/torrent-bridge/**"
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/hydra-native/target"
  - "!native/hydra-native/target/**"
  - "!native/epic-prerequisite-runner/**"
  - "!binaries/epic-prerequisite-runner/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}"
  - "!scripts/register-ts-node.mjs"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: ArcadeX
  icon: build/icon.ico
  extraResources:
    - from: legendary/win32/${arch}
      to: legendary
      filter:
        - legendary.exe
        - managed.py
        - managed-legendary.pyz
        - managed-native/**
        - managed-runtime.json
        - python/**
        - hydra-epic-process.exe
        - hydra-epic-process.json
    - from: resources/legendary
      to: legendary
      filter:
        - LICENSE
        - NOTICE.md
    - from: binaries/7z.exe
    - from: binaries/7z.dll
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
portable:
  artifactName: ${name}-${version}-portable.${ext}
  unpackDirName: false
npmRebuild: false
publish:
  provider: github
  owner: NamanGaonkar
  repo: ARCADE
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
